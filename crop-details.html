<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop Details - FarmPulse</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/responsive.css">
  
  <style>
    .crop-hero {
      position: relative;
      height: 300px;
      background-color: var(--color-primary-dark);
      border-radius: var(--radius-lg);
      margin-bottom: var(--spacing-xl);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .crop-hero::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.7));
    }
    .crop-hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .crop-hero h1 { color: white; margin-bottom: 0.5rem; font-size: 3rem; }
    
    .timeline {
      position: relative;
      max-width: 800px;
      margin: 0 auto;
      padding: var(--spacing-lg) 0;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 4px;
      background-color: var(--border-color);
      transform: translateX(-50%);
    }
    .timeline-item {
      position: relative;
      margin-bottom: var(--spacing-xl);
      width: 50%;
      padding-right: 40px;
    }
    .timeline-item:nth-child(even) {
      left: 50%;
      padding-right: 0;
      padding-left: 40px;
    }
    .timeline-icon {
      position: absolute;
      top: 0;
      right: -24px;
      width: 48px;
      height: 48px;
      background-color: var(--color-surface);
      border: 4px solid var(--color-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      z-index: 1;
    }
    .timeline-item:nth-child(even) .timeline-icon {
      left: -24px;
      right: auto;
    }
    .timeline-content {
      background-color: var(--color-surface);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }
    .timeline-content h4 { margin-bottom: 0.25rem; color: var(--color-primary); }
    .timeline-duration { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 0.5rem; font-weight: 600; display: block;}
    
    @media (max-width: 768px) {
      .timeline::before { left: 24px; }
      .timeline-item { width: 100%; padding-left: 70px; padding-right: 0; }
      .timeline-item:nth-child(even) { left: 0; padding-left: 70px; }
      .timeline-icon { left: 0; right: auto; }
      .timeline-item:nth-child(even) .timeline-icon { left: 0; }
    }
  </style>
</head>
<body>
  
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span>🌱</span> FarmPulse</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="crops.html" class="active">Crops</a>
        <a href="irrigation.html">Irrigation</a>
        <a href="planner.html">Planner</a>
        <a href="calculator.html">Calculator</a>
      </div>
      <div class="nav-actions">
        <div class="location-badge">📍 <span>Detecting...</span></div>
        <button class="theme-toggle">🌙</button>
        <button class="mobile-menu-btn">☰</button>
      </div>
    </div>
  </nav>

  <div class="mobile-menu-overlay">
    <div class="nav-links">
      <a href="index.html">🏠 Home</a>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="crops.html" class="active">🌱 Crops</a>
      <a href="irrigation.html">💧 Irrigation</a>
      <a href="planner.html">📅 Planner</a>
      <a href="calculator.html">💰 Calculator</a>
    </div>
  </div>

  <main class="container mb-xl mt-lg" id="crop-container">
    <!-- Loading State -->
    <div class="text-center py-xl">
      <h2>Loading crop details...</h2>
    </div>
  </main>

  <nav class="mobile-bottom-nav">
    <a href="index.html"><span>🏠</span> Home</a>
    <a href="dashboard.html"><span>📊</span> Dash</a>
    <a href="crops.html" class="active"><span>🌱</span> Crops</a>
    <a href="about.html"><span>ℹ️</span> About</a>
  </nav>

  <script type="module" src="./js/app.js"></script>
  <script type="module">
    import storage from './js/storage.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cropId = urlParams.get('id') || 'wheat'; // fallback to wheat
      
      try {
        // Fetch crop data
        const cropsRes = await fetch('./data/crops.json');
        const crops = await cropsRes.json();
        const crop = crops.find(c => c.id === cropId);
        
        if (!crop) throw new Error("Crop not found");
        
        // Fetch calendar data
        const calRes = await fetch('./data/crop-calendar.json');
        const calendarData = await calRes.json();
        const cropStages = calendarData[cropId]?.stages || [];
        
        renderCropDetails(crop, cropStages);
        
      } catch (e) {
        document.getElementById('crop-container').innerHTML = `
          <div class="alert alert-danger">
            <strong>Error:</strong> Could not load crop details. 
            <a href="crops.html" style="text-decoration: underline">Back to library</a>
          </div>
        `;
      }
    });

    function renderCropDetails(crop, stages) {
      const isFav = storage.isFavorite(crop.id);
      
      let html = `
        <div class="mb-md">
          <a href="crops.html" class="text-muted">← Back to Crops</a>
        </div>
        
        <div class="crop-hero">
          <div class="crop-hero-content">
            <h1>${crop.name}</h1>
            <div class="flex justify-center gap-sm mt-sm">
              <span class="badge badge-success">${crop.season}</span>
              <span class="badge badge-info">💧 ${crop.waterRequirement}</span>
              <span class="badge" style="background: rgba(255,255,255,0.2); color:white">🌡️ ${crop.temperature.min}-${crop.temperature.max}°C</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2-sm gap-lg mb-xl">
          <div class="card">
            <div class="flex justify-between items-center mb-md">
              <h3>Overview</h3>
              <button class="btn btn-secondary" style="padding: 0.25rem 0.75rem" onclick="toggleFav('${crop.id}', this)">
                ${isFav ? '♥ Favorited' : '♡ Add Favorite'}
              </button>
            </div>
            <p class="mb-md">${crop.description}</p>
            
            <div class="grid grid-cols-2 gap-md mt-lg">
              <div>
                <strong class="text-muted" style="display:block; font-size:0.85rem">Duration</strong>
                <span>${crop.duration}</span>
              </div>
              <div>
                <strong class="text-muted" style="display:block; font-size:0.85rem">Suitable Soils</strong>
                <span>${crop.soil.join(', ')}</span>
              </div>
            </div>
          </div>
          
          <div class="card" style="background-color: var(--color-warning-bg); border-color: rgba(245, 158, 11, 0.2);">
            <h3 class="mb-md" style="color: var(--color-warning)">⚠️ Care & Risks</h3>
            
            <strong style="display:block; margin-bottom: 0.25rem">Care Instructions:</strong>
            <p class="mb-md" style="font-size: 0.95rem">${crop.careInstructions}</p>
            
            <strong style="display:block; margin-bottom: 0.25rem">Common Risks:</strong>
            <ul style="list-style: disc; margin-left: 1.5rem; font-size: 0.95rem">
              ${crop.risks.map(r => `<li>${r}</li>`).join('')}
            </ul>
          </div>
        </div>
      `;

      if (stages.length > 0) {
        html += `
          <div class="text-center mb-xl">
            <h2>🌱 Crop Growing Journey</h2>
            <p class="text-muted">Typical lifecycle stages and required activities.</p>
          </div>
          <div class="timeline">
        `;
        
        stages.forEach(stage => {
          html += `
            <div class="timeline-item">
              <div class="timeline-icon">${stage.icon}</div>
              <div class="timeline-content">
                <h4>${stage.name}</h4>
                <span class="timeline-duration">${stage.duration}</span>
                <p style="font-size: 0.9rem">${stage.task}</p>
              </div>
            </div>
          `;
        });
        
        html += `</div>`;
      } else {
        html += `<div class="text-center text-muted py-xl border-dashed">Detailed timeline not available for this crop.</div>`;
      }
      
      html += `
        <div class="text-center mt-xl">
          <a href="planner.html?crop=${crop.id}" class="btn btn-primary">Start Farm Plan for ${crop.name}</a>
        </div>
      `;

      document.getElementById('crop-container').innerHTML = html;
    }
    
    // Global for inline onclick
    window.toggleFav = function(id, btnEl) {
      const isNowFav = storage.toggleFavorite(id);
      btnEl.innerHTML = isNowFav ? '♥ Favorited' : '♡ Add Favorite';
    };
  </script>
</body>
</html>
